<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir TXT a GitHub</title>
</head>
<body>
    <h2>Subir archivo de texto a repositorio de GitHub</h2>
    
    <form id="miFormulario">
        <label for="archivo">Selecciona un archivo .txt:</label>
        <input type="file" name="archivo" id="archivo" accept=".txt" required>
        <br><br>
        <button type="submit">Enviar a GitHub</button>
    </form>

    <p id="resultado" style="font-weight: bold; margin-top: 15px;"></p>

    <script>
        // CONFIGURACIÓN DE TU REPOSITORIO DE GITHUB
        const CONFIG = {
            usuario: 'scorudy-droid',       // Reemplaza con tu nombre de usuario
            repositorio: 'secadb1elalto',        // Reemplaza con el nombre del repositorio
            token: 'b48e52a347964c02dd16b23a45fb3a'      // Reemplaza con tu token de GitHub con permisos 'repo'
        };

        document.getElementById('miFormulario').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const elementoResultado = document.getElementById('resultado');
            const selectorArchivo = document.getElementById('archivo');
            const archivo = selectorArchivo.files[0];

            if (!archivo) return;

            elementoResultado.textContent = "Subiendo archivo a GitHub...";
            elementoResultado.style.color = "orange";

            // 1. Leer el archivo de texto en el navegador
            const lector = new FileReader();
            lector.readAsArrayBuffer(archivo);
            
            lector.onload = async function() {
                // La API de GitHub exige obligatoriamente que el contenido esté codificado en Base64
                const bytes = new Uint8Array(lector.result);
                let binario = '';
                for (let i = 0; i < bytes.byteLength; i++) {
                    binario += String.fromCharCode(bytes[i]);
                }
                const contenidoBase64 = btoa(binario);

                // Definir la ruta donde se guardará el archivo dentro de tu repositorio
                const urlApi = `https://api.github.com/repos/${CONFIG.usuario}/${CONFIG.repositorio}/contents/${archivo.name}`;

                // 2. Construir la estructura del payload para la API de GitHub
                const datosPayload = {
                    message: `Subida automática: ${archivo.name}`, // Mensaje del Commit
                    content: contenidoBase64                     // Contenido cifrado
                };

                try {
                    // 3. Enviar la petición PUT directamente al servidor de GitHub
                    const respuesta = await fetch(urlApi, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${CONFIG.token}`,
                            'Accept': 'application/vnd.github+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(datosPayload)
                    });

                    const datosRespuesta = await respuesta.json();

                    if (respuesta.ok) {
                        elementoResultado.textContent = `¡Éxito! El archivo se ha commiteado en GitHub.`;
                        elementoResultado.style.color = "green";
                    } else {
                        elementoResultado.textContent = `Error de GitHub: ${datosRespuesta.message}`;
                        elementoResultado.style.color = "red";
                    }
                } catch (error) {
                    console.error(error);
                    elementoResultado.textContent = "Hubo un error de conexión con la API de GitHub.";
                    elementoResultado.style.color = "red";
                }
            };
        });
    </script>
</body>
</html>
